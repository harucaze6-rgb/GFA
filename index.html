<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        // 1. Ensure window.fetch has both getter and setter so browser extensions or interceptors
        // that assign window.fetch = ... do not throw:
        // TypeError: Cannot set property fetch of #<Window> which has only a getter
        try {
          var _origFetch = window.fetch;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return _currentFetch;
                },
                set: function(fn) {
                  _currentFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          }
        } catch (e) {}

        // 2. Prevent browser extension inpage scripts from throwing uncaught cross-origin frame errors
        // (such as crypto wallet extensions trying to read top.location.origin inside iframe)
        function isExtensionOrFrameError(msg, source, stack) {
          var combined = String(msg || '') + ' ' + String(source || '') + ' ' + String(stack || '');
          return combined.indexOf('chrome-extension://') !== -1 ||
                 combined.indexOf('moz-extension://') !== -1 ||
                 combined.indexOf('Blocked a frame with origin') !== -1 ||
                 combined.indexOf('cross-origin frame') !== -1 ||
                 combined.indexOf('Cannot set property fetch of #<Window>') !== -1 ||
                 combined.indexOf('which has only a getter') !== -1;
        }

        window.addEventListener('error', function(e) {
          var msg = e.message || (e.error && e.error.message);
          var src = e.filename || (e.error && e.error.stack);
          var stack = e.error && e.error.stack;
          if (isExtensionOrFrameError(msg, src, stack)) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = reason && (reason.message || reason.stack);
          var stack = reason && reason.stack;
          if (isExtensionOrFrameError(msg, '', stack)) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
